# CI — lint, build, test on every push to main and every pull request.
#
# WHY THIS EXISTS
#
# Until v0.68 nothing ran automatically. The three other workflows in this
# folder are batch jobs (nightly curation, catalog maintenance, notifications) —
# none of them looks at the code. `npm run lint` passed, but only when someone
# remembered to type it, and the prerender bug that shipped bookless genre pages
# for two weeks would have been caught by a test that nobody was running.
#
# ORDER MATTERS: build BEFORE test. tests/build-output.test.js asserts on dist/
# — that robots.txt was actually published, that the version in the bundle
# matches the one the app announces — and it skips itself when dist/ is absent.
# Run the tests first and those checks quietly do nothing, which is the same
# class of silence they exist to catch.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's answer is
# about code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches netlify.toml's NODE_VERSION. If they drift, CI is testing a
          # runtime the site does not deploy on.
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # The build is itself a check: vite.config.js fails it when
        # public/app-version.json disagrees with the announced version, which has
        # caught a bad release once already.
        run: npm run build

      - name: Test
        run: npm run test
