# Weekly catalog maintenance — keeps ISBNs and purchase links healthy without an admin.
#
# WHAT RUNS UNATTENDED, AND WHY
# -----------------------------
# The schedule runs ONLY the free, deterministic passes:
#
#   isbnBackfill.mjs             Hardcover     — free API, rate-limited, no per-call cost
#   isbnFallback.mjs             OpenLibrary   — free, no key
#                                Google Books  — free tier, ~1,000 queries/day
#                                ISBNdb        — paid subscription, 5,000/day, first when keyed
#   languageBackfill.mjs         OpenLibrary / Google Books / ISBN registration group
#   originalLanguageBackfill.mjs Wikidata / OpenLibrary / the catalog's own work groups
#
# The two language passes (v0.64) are free, terminate, and write nothing they
# cannot corroborate. They run last because their cheapest sources are the ISBNs
# and sibling rows the earlier steps just filled.
#
# curateManualBooks.mjs is deliberately NOT on the schedule. It spends Anthropic tokens
# per book (web search, roughly 3-5 cents each), and a weekly job that quietly bills you
# is the wrong default — cost should be a decision, not a cron side effect. It is
# available on demand via workflow_dispatch with an explicit `curate_limit`, or locally.
#
# Everything the schedule does is additive: it fills a NULL field, or replaces a value
# already established as unusable (a non-English ISBN on a book that has an English
# edition). Nothing changes a book's identity, and nothing deletes. Title corrections and
# merges rewrite normalized_key and can fold one book into another — those stay manual.
#
# HOW YOU FIND OUT ABOUT IT
# -------------------------
# A file on an ephemeral runner would vanish, so:
#   1. Artifacts — every CSV uploaded, downloadable from the run page for 90 days.
#   2. A GitHub Issue — opened or commented on when EITHER there are proposals awaiting
#      approval, OR the ISBN-less backlog crosses 150 and a billable curate run is the
#      only remaining lever. The issue reports the estimated cost so the decision is
#      informed. Silence means the free passes are still making progress on their own.
#
# SECRETS (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, HARDCOVER_API_TOKEN,
#   ANTHROPIC_API_KEY, GOOGLE_BOOKS_API_KEY, ISBNDB_API_KEY
#
# ISBNDB_API_KEY must be added to the repo secrets AND to the "Compose .env.local
# from secrets" step below. Missing it fails SILENTLY — isbnFallback just skips
# the source and reports a smaller number, which is indistinguishable from the
# source having nothing to say.

name: Catalog maintenance

on:
  schedule:
    # 06:00 UTC Monday — midnight in Costa Rica, so a long run never overlaps peak use.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max books per script (blank = all)'
        required: false
        default: ''
      curate_limit:
        description: 'Run curateManualBooks on N books (BILLABLE, ~3-5c each). Blank = skip.'
        required: false
        default: ''

# Two of these runs writing to the same tables at once would double-spend API quota and
# race each other's updates.
concurrency:
  group: catalog-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    # The scripts self-throttle to stay under Hardcover's 60 req/min, so a full catalog
    # pass is slow by design. Default 360 min is the ceiling; this is well clear of it.
    #
    # v0.64 — the job budget is not the control that matters. On 2026-08-17 a
    # single step consumed the entire window and the runner cancelled it
    # mid-loop at [187/971]; the covers, metadata and regenre steps never ran at
    # all, and the summary reported their absence as zeros. Every step now has
    # its own timeout, so one slow pass costs its own budget and not the week's.
    timeout-minutes: 300

    # v0.61.2 — THIS IS THE FIX FOR "the run was green but the logs were empty".
    #
    # GitHub runs `run:` blocks as `bash -e {0}`. No pipefail. Every script step
    # here is `node script.mjs | tee x.log`, and in a pipeline without pipefail
    # the exit status is TEE's, not node's — tee always succeeds. So when a
    # script died on startup (every one of these exits 1 via its own
    # `main().catch(...)`), the step went green, the .log was empty because
    # nothing was ever written to stdout, no CSVs were produced, the summary
    # counted zero rows everywhere, needs_review stayed false, and no issue was
    # opened. A completely silent failure that looked like a clean run.
    #
    # `shell: bash` opts into `bash --noprofile --norc -eo pipefail {0}`, so a
    # script that dies now fails its step loudly.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The scripts read .env.local directly (same as when run by hand), so compose one
      # from secrets rather than teaching every script a second config path.
      - name: Compose .env.local from secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HARDCOVER_API_TOKEN: ${{ secrets.HARDCOVER_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
        run: |
          set -euo pipefail
          for v in VITE_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY HARDCOVER_API_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret $v"; exit 1; fi
          done
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "HARDCOVER_API_TOKEN=$HARDCOVER_API_TOKEN"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY"
            echo "ISBNDB_API_KEY=$ISBNDB_API_KEY"
          } > .env.local
          # Not in the required-secrets loop above: isbnFallback works without
          # it. But it works QUIETLY without it, so say so once, here.
          if [ -z "${ISBNDB_API_KEY:-}" ]; then
            echo "::warning::ISBNDB_API_KEY is not set — isbnFallback will skip the ISBNdb source."
          fi

      # writeFileSync does not create parent directories. batch-scripts/output/
      # is gitignored except for .gitkeep, so it does exist in a fresh checkout
      # — but if that .gitkeep is ever dropped, every CSV write throws and takes
      # its whole script down. One mkdir removes the class of failure.
      - name: Ensure output directory exists
        run: mkdir -p batch-scripts/output

      - name: Set common args
        id: args
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            echo "limit=--limit ${{ github.event.inputs.limit }}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=" >> "$GITHUB_OUTPUT"
          fi

      # 1. Hardcover. Resolves the most books and teaches the catalog hardcover_ids,
      #    which makes every later pass cheaper. Must run before the fallback so the
      #    fallback only sees what Hardcover genuinely couldn't answer.
      - name: Backfill ISBNs from Hardcover
        timeout-minutes: 40
        run: node batch-scripts/scheduled/isbnBackfill.mjs ${{ steps.args.outputs.limit }} | tee backfill.log

      # 2. OpenLibrary + Google Books for what's left, plus replacing non-English ISBNs
      #    on books that do have an English edition.
      # `!cancelled()` rather than `always()`: a step that FAILED must not skip
      # the passes after it — they are independent and write different columns —
      # but a run somebody cancelled should stop.
      - name: Fallback to OpenLibrary / Google Books
        if: ${{ !cancelled() }}
        timeout-minutes: 55
        run: node batch-scripts/scheduled/isbnFallback.mjs --target both ${{ steps.args.outputs.limit }} | tee fallback.log

      # 3. Covers. Runs AFTER both ISBN passes on purpose: half this script's
      #    lookup chain is ISBN-keyed (Penguin Random House CDN, Open Library by
      #    ISBN), so every ISBN resolved above turns into a cover that would
      #    otherwise have been missed this week.
      #
      #    --no-claude is mandatory here. coverBackfill's last-resort step calls
      #    Claude with web_search, and this workflow's whole premise is that the
      #    schedule spends nothing — same reason curateManualBooks below is
      #    dispatch-only. Steps 1-6 of the chain are free APIs and do the bulk
      #    of the work; run the Claude step by hand when it's worth paying for.
      #
      #    Why this matters more than it looks: 32% of the catalog (813 of 2542
      #    books) has no cover, and The Stacks filters on `cover_url IS NOT NULL`
      #    — so those books can never be shown to anyone, no matter how long a
      #    reader browses. goodreads_import is the worst offender at 58% bare.
      - name: Backfill missing covers
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: node batch-scripts/scheduled/coverBackfill.mjs --no-claude ${{ steps.args.outputs.limit }} | tee covers.log

      # 4. Descriptions and genres, from the same free APIs. Runs last of the
      #    free passes because it reads books that already have a cover — a book
      #    the cover step just rescued becomes eligible in the same run.
      #
      #    This step exists so that Claude does not have to. 682 books had a
      #    cover but no description, and the only routes to fixing that were
      #    curateManualBooks or oracleBatch, both of which bill Anthropic for
      #    text Hardcover and Open Library give away. Descriptions are facts
      #    somebody already wrote down; the Oracle budget belongs on judgment —
      #    recommendations, plans, memory — not on retrieval.
      #
      #    Genre inference rides along in the same requests: the subject lists
      #    come back in the same responses as the descriptions, and a keyword
      #    table maps them onto the canonical 15. Books matching no rule are
      #    left null and listed in genre-unmatched.csv rather than guessed at.
      - name: Backfill descriptions and genres
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        run: node batch-scripts/scheduled/metadataBackfill.mjs --target both ${{ steps.args.outputs.limit }} | tee metadata.log

      # 4b. Re-apply the genre rules to everything already fetched. FREE and
      #     OFFLINE — no network at all, seconds rather than hours — so it does
      #     not touch the "the schedule spends nothing" premise this file is
      #     built on.
      #
      #     regenreCatalog is otherwise manual by design, and the --fetch and
      #     --report phases stay that way: --fetch is hours of HTTP and --report
      #     is a decision aid. But --apply is pure computation over subjects
      #     already stored on the row, and leaving it manual meant that editing
      #     _shared/genreRules.mjs improved nothing until somebody remembered to
      #     run it by hand. A rule change should reach the catalogue on its own.
      #
      #     --replace is deliberately NOT passed. Without it this only adds
      #     links; with it, it would clear previous machine assignments first,
      #     which is a destructive re-write and belongs in a run someone is
      #     watching.
      - name: Re-apply genre rules to stored subjects (free, offline)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node batch-scripts/manual/regenreCatalog.mjs --apply | tee regenre.log

      # 4c. books.language — v0.64. Free: OpenLibrary, Google Books, and the
      #     ISBN registration group, which is offline and answers for the recent
      #     non-Anglophone printings the APIs have never indexed.
      #
      #     After both ISBN passes, because every one of its sources is
      #     ISBN-keyed — an ISBN resolved above becomes a language in the same
      #     run. It writes NOTHING when the ISBN's language and the title
      #     disagree: books.isbn is chosen for a purchase link and is not
      #     necessarily this row's edition, and a wrongly-populated language
      #     column outranks the title heuristic everywhere it is consulted.
      - name: Backfill book languages (free)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: node batch-scripts/scheduled/languageBackfill.mjs ${{ steps.args.outputs.limit }} | tee language.log

      # 4d. books.original_language — v0.64. Wikidata P364, OpenLibrary
      #     translated_from, then propagation across the catalog's own work
      #     groups. Free, no keys, and it terminates.
      #
      #     Last, because its cheapest source is other rows: every answer found
      #     above spreads to every sibling row of the same work at no cost.
      #     Refuses to answer from a title match that the author does not
      #     corroborate, and never writes a guess — an unresolved row stays NULL
      #     and stays eligible for the nightly Oracle pass.
      - name: Backfill original languages (free)
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: node batch-scripts/scheduled/originalLanguageBackfill.mjs ${{ steps.args.outputs.limit }} | tee origlanguage.log

      # 5. Claude — MANUAL ONLY. Never runs on the schedule; only when someone types a
      #    number into curate_limit, which makes the spend an explicit, bounded decision.
      #    Produces proposals in a CSV; applying them is still a separate --apply-titles
      #    run, so nothing here changes a title or merges a book.
      - name: Curate manually-added rows (billable)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.curate_limit != '' }}
        run: |
          echo "::warning::Running curateManualBooks on ${{ github.event.inputs.curate_limit }} books — this bills Anthropic."
          node batch-scripts/manual/curateManualBooks.mjs --limit ${{ github.event.inputs.curate_limit }} | tee curate.log

      - name: Summarise
        id: summary
        if: always()
        run: |
          set -uo pipefail
          csv_rows() { [ -f "$1" ] && [ "$(wc -l < "$1")" -gt 1 ] && echo $(( $(wc -l < "$1") - 1 )) || echo 0; }

          # THE 2026-08-17 LESSON, IN ONE FUNCTION.
          #
          # Every script prints a counters line as its last act, so the line
          # exists only if the script REACHED its last act. Reading that instead
          # of counting CSV rows is what makes "did not finish" distinguishable
          # from "nothing to do": a cancelled fallback left no CSV, the table
          # counted its absent rows as 0, and the summary said
          # "Still unresolved after OL/Google: 0" about a step that had died at
          # [187/971].
          #
          # A missing counter renders as an em dash, never as a number.
          counter() {   # counter <logfile> <field>
            [ -f "$1" ] || { echo "—  (did not run)"; return; }
            local v
            v=$(grep -o "$2=[0-9]*" "$1" 2>/dev/null | tail -1 | cut -d= -f2 || true)
            [ -n "$v" ] && echo "$v" || echo "—  (did not finish)"
          }
          # metadataBackfill prints a machine-readable last line:
          #   [metadataBackfill] descriptions=N genres=N unmatchedGenre=N nothingFound=N
          # Nothing was reading it, which is why a run that filled hundreds of
          # descriptions reported nothing about them — the table only ever
          # counted CSV rows, and metadataBackfill's CSV lists its FAILURES.
          # Absence of a genre-unmatched.csv means total success, and rendered
          # as a row of zeros indistinguishable from "never ran".
          meta_field() {
            grep -o "$1=[0-9]*" metadata.log 2>/dev/null | tail -1 | cut -d= -f2 || true
          }
          DESCS=$(meta_field descriptions); DESCS=${DESCS:-0}
          GENRES=$(meta_field genres);      GENRES=${GENRES:-0}
          NOTHING=$(meta_field nothingFound); NOTHING=${NOTHING:-0}

          UNRESOLVED=$(counter backfill.log unresolved)
          STILL=$(counter fallback.log stuck)
          # complete=0 means isbnFallback flushed partial output on a signal.
          # The billable-curation issue must not fire on a partial number — that
          # is how a transient Hardcover outage turned into a recommendation to
          # spend ~$39 on books that were never missing.
          FB_COMPLETE=$(grep -o 'complete=[01]' fallback.log 2>/dev/null | tail -1 | cut -d= -f2 || true)
          FB_COMPLETE=${FB_COMPLETE:-0}
          LANG_WRITTEN=$(counter language.log written)
          ORIGLANG_WRITTEN=$(counter origlanguage.log written)
          ORIGLANG_PROP=$(counter origlanguage.log propagated)
          PROPOSED=$(csv_rows batch-scripts/output/proposed-titles.csv)
          # Books whose subject lists matched no rule in GENRE_RULES. Read this
          # before considering any Claude spend on genres: a theme recurring
          # here is a one-line fix in metadataBackfill.mjs, not a billable run.
          NOGENRE=$(csv_rows batch-scripts/output/genre-unmatched.csv)
          echo "unresolved=$UNRESOLVED" >> "$GITHUB_OUTPUT"
          echo "still=$STILL"           >> "$GITHUB_OUTPUT"
          echo "proposed=$PROPOSED"     >> "$GITHUB_OUTPUT"
          echo "nogenre=$NOGENRE"       >> "$GITHUB_OUTPUT"
          # Two different reasons to raise an issue:
          #   PROPOSED > 0        a curate run happened and its output needs approving.
          #   STILL >= BACKLOG    the free passes have plateaued; a (billable) curate run
          #                       is now the only thing that will move the number. Told,
          #                       not done — the whole point of taking Claude off the cron.
          BACKLOG_THRESHOLD=150
          NEEDS=false
          [ "$PROPOSED" -gt 0 ] && NEEDS=true
          # Numeric comparisons only against a number. STILL is an em dash when
          # the step did not finish, and "did not finish" is never a reason to
          # recommend spending money.
          case "$STILL" in
            ''|*[!0-9]*) : ;;
            *) [ "$FB_COMPLETE" = "1" ] && [ "$STILL" -ge "$BACKLOG_THRESHOLD" ] && NEEDS=true ;;
          esac
          echo "needs_review=$NEEDS" >> "$GITHUB_OUTPUT"
          # ~4c/book: 3-5c covers Sonnet tokens plus up to 4 web searches.
          case "$STILL" in
            ''|*[!0-9]*) echo "curate_cost=0.00" >> "$GITHUB_OUTPUT" ;;
            *) echo "curate_cost=$(awk -v n="$STILL" 'BEGIN{printf "%.2f", n*0.04}')" >> "$GITHUB_OUTPUT" ;;
          esac

          {
            echo "## Catalog maintenance"
            echo ""
            echo "| Output | Rows |"
            echo "| --- | --- |"
            echo "| Title changes awaiting approval | $PROPOSED |"
            echo "| ISBNs unresolved after Hardcover | $UNRESOLVED |"
            echo "| Still unresolved after OL/Google | $STILL |"
            echo "| Books with subjects but no genre rule | $NOGENRE |"
            echo "| Descriptions filled (free APIs) | $DESCS |"
            echo "| Genres filled (free APIs) | $GENRES |"
            echo "| Looked up, nothing found | $NOTHING |"
            echo "| Languages filled | $LANG_WRITTEN |"
            echo "| Original languages filled | $ORIGLANG_WRITTEN |"
            echo "| Original languages propagated to siblings | $ORIGLANG_PROP |"
            echo ""
            # Report every expected log, including the ones that are missing or
            # empty. `continue`-ing past an absent file is what made a silent
            # failure look identical to a step that had nothing to say.
            for f in backfill fallback covers metadata regenre language origlanguage curate; do
              if [ ! -f "$f.log" ]; then
                # curate is dispatch-only, so its absence is normal.
                [ "$f" = "curate" ] && continue
                echo "⚠️ **$f** — no log file. The step did not run, or died before writing anything."
                echo ""
                continue
              fi
              if [ ! -s "$f.log" ]; then
                echo "⚠️ **$f** — log is empty. The script produced no stdout at all."
                echo ""
                continue
              fi
              echo "<details><summary>$f ($(wc -l < "$f.log") lines)</summary>"
              echo ""
              echo '```'
              tail -n 20 "$f.log"
              echo '```'
              echo "</details>"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review-${{ github.run_number }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            batch-scripts/output/*.csv
            *.log

      # Only nags when there is a decision to make. A weekly issue that usually says
      # "nothing to do" trains you to ignore it.
      - name: Open review issue
        if: ${{ always() && steps.summary.outputs.needs_review == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { proposed, unresolved, still, curate_cost } = ${{ toJSON(steps.summary.outputs) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Catalog review';

            const lines = [];
            if (Number(proposed) > 0) {
              lines.push(
                `**${proposed}** proposed title/author correction(s) need a decision.`,
                '',
                `Download \`proposed-titles.csv\` from ${runUrl}`,
                '',
                'Put `y` in the `approve` column on the rows you accept, then run locally:',
                '```',
                'node batch-scripts/manual/curateManualBooks.mjs --apply-titles --dry-run',
                'node batch-scripts/manual/curateManualBooks.mjs --apply-titles',
                '```',
                '',
                'Rows with `merge_into` set FOLD one book into another and delete the source,',
                'repointing wishlist/library entries. Check those individually — it is the only',
                'irreversible operation in this pipeline.',
                ''
              );
            }
            lines.push(
              `**${still}** book(s) still have no ISBN after Hardcover, OpenLibrary and Google Books.`,
              '',
              'The free passes have taken these as far as they go. Claude web-search identification',
              `is the next lever, and it is billable — roughly **$${curate_cost}** for all ${still}`,
              'at ~4c each. It is deliberately not on the schedule.',
              '',
              'Run a bounded batch when you want to:',
              '```',
              'node batch-scripts/manual/curateManualBooks.mjs --limit 25 --verbose',
              '```',
              'or trigger this workflow manually with `curate_limit` set.',
              '',
              'Expect diminishing returns: much of this tail is self-published, non-English or',
              'genuinely uncatalogued, and a low-confidence "unidentified" is the correct answer',
              'rather than a failure.',
              '',
              `<sub>Unresolved after Hardcover: ${unresolved} · run: ${runUrl}</sub>`
            );
            const body = lines.join('\n');

            // Reuse one open issue rather than opening a new one weekly.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'catalog-review',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['catalog-review'],
              });
            }
