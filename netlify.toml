[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  # Stays on 20. Node 22 would give every function a native WebSocket and let
  # send-notification-email.js drop its `ws` dependency and realtime.transport
  # option — that alternative is recorded in that file's own header — but it is
  # a runtime change for the whole site and does not belong in an SEO release.
  # Worth doing deliberately, on its own, with the `ws` cleanup alongside it.
  NODE_VERSION = "20"

# The @netlify/plugin-emails plugin is installed from the Netlify UI, not from
# this file, and it generates .netlify/functions-internal/emails/index.js as
# CommonJS. package.json declares "type": "module", so Node refuses to load it
# and the build dies before it reaches the site.
#
# Forcing esbuild makes that function bundle instead of being copied, which
# sidesteps the module-type resolution. This is a STOPGAP. The repo has no
# emails/ template directory and no function that calls the plugin — mail goes
# out through netlify/functions/send-notification-email.js — so the real fix is
# to uninstall the plugin in the Netlify UI and delete this block with it.
[functions."emails"]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"
  envFile = ".env.local"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self) — same-origin pages may request the camera; every other
    # origin, including anything we embed, still cannot. Needed for the ISBN
    # scanner (claude/isbn-scan-v1-spec.md): with camera=() this site gets a
    # NotAllowedError from getUserMedia before a permission prompt ever
    # appears, on every browser, with no way for the reader to grant it.
    # microphone and geolocation stay fully denied — nothing here asks for them.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # No media-src directive here on purpose. A camera stream is attached with
    # video.srcObject = stream, which is an object reference rather than a URL
    # fetch, so CSP never evaluates it. Only the deprecated
    # URL.createObjectURL(stream) path would need `media-src 'self' blob:`, and
    # we do not use it. Do not widen this header speculatively.
    #
    # The scanner's real CSP constraint is script-src: loading a barcode
    # decoder from a CDN would be blocked by 'self'. Bundle @zxing/library from
    # npm as a dynamic import so Vite emits it as a local chunk — no CDN, no
    # header change, and it stays out of the main bundle either way.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://assets.lemonsqueezy.com https://app.lemonsqueezy.com; style-src 'self' 'unsafe-inline' https://assets.lemonsqueezy.com https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://*.lemonsqueezy.com https://thebooksoracle.lemonsqueezy.com https://api.lemonsqueezy.com https://openlibrary.org https://covers.openlibrary.org https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.lemonsqueezy.com https://thebooksoracle.lemonsqueezy.com; font-src 'self' https://fonts.gstatic.com data:; worker-src 'self' blob:;"

# v0.56: the version file must never be cached by anything. The client fetch
# already sends cache: 'no-store', which covers the browser cache, but that
# says nothing to intermediary proxies (corporate, ISP, mobile carrier) between
# the client and the edge. A stale copy here silently disables the critical
# update path, so state it in the header too.
[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# v0.39: dynamic sitemap — must come before the SPA catch-all below so
# /sitemap.xml resolves to the function's XML instead of index.html.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[edge_functions]]
  path = "/*" # The URL path you want to hit
  function = "og-prerender"

# SPA fallback: any unknown route returns index.html so client-side
# routing (and the OAuth redirect after Google sign-in) works.
# Note: /.netlify/functions/* is automatically excluded.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200